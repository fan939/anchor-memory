services:
  anchor-memory:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - anchor-data:/data/anchor
      - anchor-model-cache:/data/model-cache
    mem_limit: 2800m
    cpus: 3.0
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      anchor-memory:
        condition: service_healthy
    environment:
      ANCHOR_DOMAIN: ${ANCHOR_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

volumes:
  anchor-data:
  anchor-model-cache:
  caddy-data:
  caddy-config:
