services:
  anchor-memory:
    # Explicit image/container/volume names keep production independent of the
    # directory or Compose project name. They prevent an upgrade from silently
    # creating a fresh, empty memory volume.
    image: "anchor-memory:${ANCHOR_IMAGE_TAG:-local}"
    build: .
    container_name: anchor-memory
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${ANCHOR_LOCAL_PORT:-8100}:8000"
    volumes:
      - anchor-memory-data:/data/anchor
      - anchor-memory-model-cache:/data/model-cache
    mem_limit: 2800m
    cpus: 3.0
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# Production HTTPS is terminated by the host Nginx service. Do not add a
# second proxy here: it would compete for ports 80/443 and hide the real path.
volumes:
  anchor-memory-data:
    external: true
    name: ${ANCHOR_DATA_VOLUME:-anchor-memory-data}
  anchor-memory-model-cache:
    external: true
    name: ${ANCHOR_MODEL_CACHE_VOLUME:-anchor-memory-model-cache}
